name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: |
          bun test \
            tests/cli/launch-paths.test.ts \
            tests/config \
            tests/core/content-extraction.test.ts \
            tests/core/contradiction-resolver.test.ts \
            tests/core/db-client.test.ts \
            tests/core/encryption.test.ts \
            tests/core/filter-builder.test.ts \
            tests/core/memory-explain.test.ts \
            tests/core/projects.test.ts \
            tests/core/schemas.test.ts \
            tests/core/self-iteration-job.test.ts \
            tests/core/session-working-set.test.ts \
            tests/core/signal-engine.test.ts \
            tests/core/snapshots-comparison.test.ts \
            tests/core/summarization-strategies.test.ts \
            tests/core/telemetry.test.ts \
            tests/core/temporal-facts.test.ts \
            tests/core/trigger-detector.test.ts \
            tests/core/trust-report.test.ts \
            tests/core/utils.test.ts \
            tests/core/validation.test.ts \
            tests/core/vector-operations.test.ts \
            tests/core/write-gate.test.ts \
            tests/core/memory \
            tests/db \
            tests/merge \
            tests/mcp/stdio-e2e.test.ts \
            tests/mcp/http-e2e.test.ts \
            tests/mcp/tool-handlers.test.ts \
            tests/mcp/schema-validation.test.ts \
            tests/mcp/console-redirect.test.ts \
            tests/mcp/stdio-pipe.test.ts \
            tests/mcp/background-services.test.ts \
            tests/mcp/universal-contract.test.ts \
            tests/mcp/remote-auth-contract.test.ts \
            tests/mcp/recall-surface.test.ts \
            --pass-with-no-tests
        env:
          SQUISH_MODE: local
          SQUISH_QUIET: "1"

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to npm
        if: contains(github.ref, 'tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          bun publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: contains(github.ref, 'tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Squish v${{ steps.version.outputs.version }}
          body: |
            ## What's New in v${{ steps.version.outputs.version }}

            Squish provides universal persistent memory for AI agents with support for MCP, CLI, and HTTP API.

            ### Key Features
            - Two-tier memory architecture (QMD search + SQLite/PostgreSQL storage)
            - Trigger detection, contradiction resolution, and temporal facts
            - Universal API compatible with any AI agent framework
            - MCP server integration for Claude Code, OpenClaw, and other MCP clients

            ### Installation
            ```bash
            npx squish-install
            ```

            Or visit: https://github.com/michielhdoteth/squish-memory

            ## Distribution
            This release is published to npm as `squish-memory`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
